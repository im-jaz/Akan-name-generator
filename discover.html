<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Your Akan Name | Akan Origins</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@300;400;500;600;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<!-- nav -->

<header>

    <nav class="navbar">

        <div class="logo">
            <span class="gold">Akan</span> Origins
        </div>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>
            <li><a href="discover.html" class="active">Discover</a></li>
            <li><a href="about.html">About & History</a></li>
            <li><a href="results.html">Reveal</a></li>

        </ul>

    </nav>

</header>

<!-- generator section -->

<section class="generator">

    <div class="generator-form">

        <form id="akanForm">

            <div class="input-group">

                <label for="name">
                    First Name
                </label>

                <input
                     type="text"
                     id="name"
                     placeholder="Enter your first name">

            </div>

            <div class="input-group">

                <label for="dob">
                     Date of Birth
                </label>

                <input
                     type="date"
                     id="dob">

            </div>

             <div class="input-group">

                 <label>
                     Gender
                </label>

                 <div class="gender-options">

                    <label class="radio-option">

                        <input
                        type="radio"
                        name="gender"
                        value="male">

                        <span>Male</span>

                    </label>

                    <label class="radio-option">

                        <input
                        type="radio"
                        name="gender"
                        value="female">

                        <span>Female</span>

                        </label>

                    </div>

                </div>

                <button
                    type="submit"
                    class="discover-btn">

                    Discover My Akan Name

                </button>

            </form>

        </div>

</section>


<!-- footer -->

<footer>

    <div class="footer-content">

        <div class="footer-logo">

            <h2>
                <span>Akan</span> Origins
            </h2>

            <p>

                Celebrating African heritage through
                culture, identity, and storytelling.

            </p>

        </div>

        <div class="footer-links">

            <h3>Quick Links</h3>

            <a href="index.html">Home</a>
            <a href="discover.html">Discover</a>
            <a href="about.html">About & History</a>
            <a href="results.html">Reveal</a>

        </div>

        <div class="footer-social">

            <h3>Follow Us</h3>

            <a href="#"><i class="fab fa-facebook-f"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="#"><i class="fab fa-x-twitter"></i></a>
            <a href="#"><i class="fab fa-github"></i></a>

        </div>

    </div>

    <div class="footer-bottom">

        <p>

            © 2026 Akan Origins. All Rights Reserved.

        </p>

    </div>

</footer>
<script src="./script.js"></script>
</body>
</html>
